spring:
  security:
    oauth2:
      client:
        registration:
          msg-process-client:
            client-id: your-client-id
            client-secret: your-client-secret
            authorization-grant-type: client_credentials
        provider:
          msg-process-client:
            token-uri: http://your-auth-server/oauth2/token
  application:
    name: msg-process
  cloud:
    stream:
      default-binder: local-kafka
      bindings:
        inbound:
          binder: local-kafka
          destination: inbound
          contentType: application/json
        binders:
          local-kafka:
            type: kafka
            environment:
              spring:
                cloud:
                  stream:
                    kafka:
                      binder:
                        brokers: localhost:9092
    config:
      uri: http://config:8888
      fail-fast: true
      password: ${CONFIG_SERVICE_PASSWORD}
      username: ${CONFIG_USER_NAME}
  kafka:
    bootstrap-servers: localhost:9092
    topic:
      result: msg-process-result
    group-id: msgresult