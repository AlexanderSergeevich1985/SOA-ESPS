version: '3.8'

services:
  # ===================================================================
  # 1. INFRASTRUCTURE & STORAGE LAYER (Always Running)
  # ===================================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      # Добавлена база данных для нового сервиса: scheduler_db
      - POSTGRES_MULTIPLE_DATABASES=auth_db,payments_db,metrics_db,notifications_sql_db,profile_db,scheduler_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PWD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongodata:/data/db
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 5

  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    container_name: triton-server
    profiles: ["ml"]
    ports:
      - "8001:8001"
    volumes:
      - ./model_repository:/models
    command: ["tritonserver", "--model-repository=/models"]
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/v2/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===================================================================
  # 2. ROUTING, DISCOVERY & CONFIGURATION LAYER
  # ===================================================================
  eureka-service:
    build: ./eureka-service
    container_name: eureka-service
    profiles: ["core", "eureka"]
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=TEST
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=TEST
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
    volumes:
      - ./files-config:/home/soauser/files-config:ro
      - ./mcg-config:/home/soauser/mcg-config:ro
    networks:
      - soa-mesh-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://user:${CONFIG_SERVICE_PASSWORD}@localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    profiles: ["core", "gate"]
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=DEV
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

  # ===================================================================
  # 3. SECURITY & IDENTITY LAYER
  # ===================================================================
  auth-service:
    build: ./auth-service
    container_name: auth-service
    profiles: ["core", "auth"]
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PWD}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - CERTS_PASSWORD=${CERTS_PASSWORD}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    volumes:
      - ./certs:/etc/certs:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

  # ===================================================================
  # 4. BUSINESS CORE SERVICES LAYER
  # ===================================================================
  payments-service:
    build: ./payments-service
    container_name: payments-service
    profiles: ["core", "payments"]
    ports:
      - "8443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PWD}
      - CERTS_PASSWORD=${CERTS_PASSWORD}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    volumes:
      - ./certs:/etc/certs:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

  documents-service:
    build: ./documents-service
    container_name: documents-service
    profiles: ["core", "docs"]
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DB=documents
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/documents?authSource=admin
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-service:8000/oauth2/token
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-service:8000/oauth2/jwks
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      mongodb:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

  notifications-service:
    build: ./notifications-service
    container_name: notifications-service
    profiles: ["core", "notifications"]
    ports:
      - "9443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/notifications_sql_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PWD}
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=templates
      - SPRING_DATA_MONGODB_USERNAME=${MONGO_USER}
      - SPRING_DATA_MONGODB_PASSWORD=${MONGO_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - CERTS_PASSWORD=${CERTS_PASSWORD}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_NOTIFICATIONS_ENABLED=${TELEGRAM_NOTIFICATIONS_ENABLED}
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    volumes:
      - ./certs:/etc/certs:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

  profile-service:
    build: ./profile-service
    container_name: profile-service
    profiles: ["core", "profile"]
    ports:
      - "10443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/profile_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PWD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CERTS_PASSWORD=${CERTS_PASSWORD}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    volumes:
      - ./certs:/etc/certs:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

  scheduler-service:
    build: ./scheduler-service
    container_name: scheduler-service
    profiles: ["core", "scheduler"]
    ports:
      - "11443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - DB_URL=jdbc:postgresql://postgres-db:5432/scheduler_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PWD}
      - KEYSTORE_PASSWORD=${CERTS_PASSWORD}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

  # ===================================================================
  # 5. DATA ANALYTICS & MACHINE LEARNING PIPELINE
  # ===================================================================
  msg-process:
    build: ./msg-process
    container_name: msg-process
    profiles: ["ml"]
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TRITON_HOST=triton-server
      - TRITON_GRPC_PORT=8001
      - OAUTH_TOKEN_URI=http://auth-service:8000/oauth2/token
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      kafka:
        condition: service_healthy
      triton-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - soa-mesh-network

  aggregator-service:
    build: ./aggregator-service
    container_name: aggregator-service
    profiles: ["ml"]
    environment:
      - SPRING_PROFILES_ACTIVE=DOCKER
      - CONFIG_USER_NAME=${CONFIG_USER_NAME}
      - CONFIG_SERVICE_PASSWORD=${CONFIG_SERVICE_PASSWORD}
      - SPRING_CONFIG_IMPORT=optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config-server:8888
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PWD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    networks:
      - soa-mesh-network

volumes:
  pgdata:
  mongodata:
  miniodata:

networks:
  soa-mesh-network:
    name: soa-mesh
    driver: bridge
