spring:
   profiles:
       active: DEV#TEST

   datasource:
     url: jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
     driver-class-name: org.h2.Driver
     username: sa
     password: ""

   jpa:
     database-platform: org.hibernate.dialect.H2Dialect
     hibernate:
       ddl-auto: create-drop
     show-sql: false

soaesps:
    config-server:
         client: http://localhost:8080/config/