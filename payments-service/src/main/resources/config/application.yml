# ===================================================================
# GLOBAL APP INITIALIZATION
# ===================================================================
spring:
  application:
    name: payments-service
  profiles:
    active: DEV # Default profile for local boot

  kafka: # URL of the running Kafka broker(s)
    bootstrap-servers: localhost:9092

    producer:
      # Serializer class for message keys
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Serializer class for message values
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Number of acknowledgments the producer requires the leader to have received (all, 1, or 0)
      acks: all
      # Number of retries if the request fails
      retries: 3

    consumer:
      # Unique string that identifies the consumer group this consumer belongs to
      group-id: my-awesome-group
      # What to do when there is no initial offset in Kafka (earliest or latest)
      auto-offset-reset: earliest
      # Deserializer class for message keys
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Deserializer class for message values
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

soaesps:
  config-server:
    client: http://localhost:8080/config/

---
# ===================================================================
# PROFILE: DEV (Local development - Clean HTTP, No SSL overhead)
# ===================================================================
spring:
  config:
    activate:
      on-profile: DEV
    import: "optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@localhost:8888"

  cloud:
    config:
      import-check:
        enabled: false # Disables strict import checking before profiles activate

  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}        # Pulls from system env, defaults to postgres
    password: ${POSTGRES_PWD:postgres}    # Pulls from system env, defaults to postgres
    hikari:
      maximum-pool-size: 4

  jpa:
    # Modern dialect for Spring Boot 3.4.1 (automatically resolves engine specifics)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
    show-sql: false
    generate-ddl: false
    properties:
      hibernate:
        cache:
          use_second_level_cache: true
          use_query_cache: false
          region:
            factory_class: org.hibernate.cache.ehcache.SingletonEhCacheRegionFactory

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth-service
          jwk-set-uri: http://localhost:8081/auth-service/oauth2/jwks

server:
  port: 8082 # Or your designated local port
  ssl:
    enabled: false # Explicitly disabled locally so Tomcat boots without .p12 files

soa:
  security:
    jwt:
      enabled: true
    permit-all:
      - /actuator/health/**
    internal:
      - /api/internal/**
    mtls:
      enabled: false # Switched off for local HTTP debugging

---
# ===================================================================
# PROFILE: DOCKER / PROD (Secure internal mesh with unique mTLS)
# ===================================================================
spring:
  config:
    activate:
      on-profile: DOCKER

  datasource:
    url: jdbc:postgresql://postgres-db:5432/payments_db # Internal network host
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PWD}
    hikari:
      maximum-pool-size: 10 # Expanded pool for production-like load

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  
  security:
    oauth2:
      resourceserver:
        jwt:
          # Production domain or internal cloud route mapping
          issuer-uri: https://soa-esps.ru
          jwk-set-uri: http://auth-service:8000/oauth2/jwks

server:
  port: 8443
  ssl:
    enabled: true
    client-auth: want
    key-store: "file:/etc/certs/${spring.application.name}.p12" # Uses app name dynamically
    key-store-password: "${CERTS_PASSWORD}"
    key-store-type: "PKCS12"
    trust-store: "file:/etc/certs/internal-truststore.p12"
    trust-store-password: "${TRUSTSTORE_PASSWORD}"
    trust-store-type: "PKCS12"

soa:
  security:
    jwt:
      enabled: true
    permit-all:
      - /actuator/health/**
    internal:
      - /api/internal/**
    mtls:
      enabled: true # Enforces X.509 client certificate verification over mTLS mesh

---
# ===================================================================
# PROFILE: TEST (Isolated Maven Builds & JUnit testing)
# ===================================================================
spring:
  config:
    activate:
      on-profile: TEST
  cloud:
    config:
      enabled: false
      import-check.enabled: false

  # Switches database connection to a lightning-fast, zero-setup in-memory H2 database
  datasource:
    url: jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop # Dynamically builds schemas per test context session

server:
  port: 0

soa:
  security:
    jwt:
      enabled: false
    permit-all:
      - "/**" # Completely eliminates security context crashes during data validation tests
    internal: []
    mtls:
      enabled: false