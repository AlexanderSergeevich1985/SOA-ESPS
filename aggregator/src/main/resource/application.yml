# =================================================================
# SPRING CORE & NETWORKING SETTINGS
# =================================================================
server:
  # Port 0 forces Spring Boot to pick a random available ephemeral port.
  # Ideal for local multi-instance Pekko cluster testing without port conflicts.
  port: 0

spring:
  application:
    name: soaesps-aggregator

  # --- Spring Cloud Stream Configuration (Kafka Transport) ---
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

    function:
      definition: telemetryIn;metricsIn
    stream:
      bindings:
        telemetryIn-in-0:
          destination: ml-metrics
          group: aggregator-sharding-bridge
          content-type: application/json
        metricsIn-in-0:
          destination: ml-metrics
          group: aggregator-metrics-writer
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          auto-create-topics: true
        bindings:
          metricsIn-in-0:
            consumer:
              batch-mode: true
              configuration:
                max.poll.records: 100
                fetch.min.bytes: 102400

  # --- Outbound Kafka Template Configurations ---
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.soaesps.aggregator.domain"

  # --- Data Sources Configurations (Connecting to Docker containers) ---
  datasource:
    # Connects to the TimescaleDB container via host port 5432
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/aggregator_db
    username: ${POSTGRES_USER:default_user}
    password: ${POSTGRES_PWD:default_pass}
    driver-class-name: org.postgresql.Driver
    # HikariCP connection pool optimization for aggressive streaming pipelines
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

# --- Temporal Client Configuration ---
# Tells the Temporal SDK where to find the Temporal Orchestrator container
temporal:
  connection:
    target: ${TEMPORAL_HOST:localhost}:${TEMPORAL_PORT:7233}

# =================================================================
# LANGCHAIN4J AI INFRASTRUCTURE (ROUTING & PROTOCOLS FOR QWEN)
# =================================================================
langchain4j:
  chat-model:
    provider: open-ai
    model-name: qwen-2.5-coder-32b
  embedding-model:
    provider: open-ai
    model-name: text-embedding-3-small

  open-ai:
    chat-model:
      base-url: https://groq.com
      api-key: ${GROQ_API_KEY:gsk_placeholder_key}
      model-name: qwen-2.5-coder-32b
      timeout: 60s
      log-requests: true
      log-responses: true
    embedding-model:
      api-key: ${OPENAI_API_KEY:mock-key}

# =================================================================
# PRODUCTION MONITORING & METRICS (ACTUATOR)
# =================================================================
management:
  health:
    binders:
      # Exposes real-time Kafka cluster connection health via /actuator/health
      enabled: true

aggregator:
  report:
    cron: "0 0 */6 * * *"