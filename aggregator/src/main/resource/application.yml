# ===================================================================
# GLOBAL APP INITIALIZATION & DEFAULT STATE
# ===================================================================
spring:
  application:
    name: soaesps-aggregator
  profiles:
    active: DEV # Default profile for local boot execution
  cloud:
    compatibility-verifier:
      # Bypasses rigid release train compatibility checks for Boot 3.4.1 locally and in containers
      enabled: false

# --- LangChain4j GenAI Extensible Strategy Route Parameters (Qwen 2.5) ---
langchain4j:
  chat-model:
    provider: open-ai
    model-name: qwen-2.5-coder-32b
  embedding-model:
    provider: open-ai
    model-name: text-embedding-3-small

# --- Redis Cache In-Memory Network Setup Bounds ---
redis:
  master: master
  port: 6379
  factory:
    type: Lettuce
  # Flat comma-separated array string preventing complex SpEL map conversion errors
  addresses: localhost:26379

# --- Automated 6-Hour Batch Cron Trigger Parameter ---
aggregator:
  report:
    cron: "0 0 */6 * * *"

# =================================================================
# PRODUCTION MONITORING & METRICS (ACTUATOR)
# =================================================================
management:
  health:
    binders:
      enabled: true

---
# ===================================================================
# PROFILE: DEV / LOCAL (Combined environment for local HTTP workflow)
# ===================================================================
spring:
  config:
    activate:
      on-profile: DEV, LOCAL
    import: "optional:configserver:" # Blocks boot crashes if Config Server is absent locally

  # FIXED: Unified single cloud block to prevent DuplicateKeyException
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    function:
      definition: telemetryIn;metricsIn
    stream:
      bindings:
        telemetryIn-in-0:
          destination: ml-metrics
          group: aggregator-sharding-bridge
          content-type: application/json
        metricsIn-in-0:
          destination: ml-metrics
          group: aggregator-metrics-writer
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
        bindings:
          metricsIn-in-0:
            consumer:
              batch-mode: true
              configuration:
                max.poll.records: 100
                fetch.min.bytes: 102400

  # Outbound Native Kafka Template Configurations
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.soaesps.aggregator.domain"

  # Pure Low-Latency Direct JDBC Connection Pool targeting TimescaleDB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/aggregator_db
    username: ${POSTGRES_USER:default_user}
    password: ${POSTGRES_PWD:default_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

# --- Cloud Qwen via ultra-fast Groq LPU API Wire Protocol ---
langchain4j:
  open-ai:
    chat-model:
      base-url: https://groq.com
      api-key: ${GROQ_API_KEY:gsk_placeholder_key}
      model-name: qwen-2.5-coder-32b
      timeout: 60s
      log-requests: true
      log-responses: true
    embedding-model:
      api-key: ${OPENAI_API_KEY:mock-key}

# --- Temporal Orchestrator local gRPC connection target channel ---
temporal:
  connection:
    target: ${TEMPORAL_HOST:localhost}:${TEMPORAL_PORT:7233}

# --- Disable Eureka client lookups globally to prevent 8761 loop crashes ---
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

server:
  port: 0 # Ephemeral port selection prevents cluster multi-instance routing conflicts

---
# ===================================================================
# PROFILE: DOCKER (Secure internal service-to-service cluster bridge)
# ===================================================================
spring:
  config:
    activate:
      on-profile: DOCKER

  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka:9092 # Reroutes traffic inside Docker virtual network bridge

  kafka:
    bootstrap-servers: kafka:9092

  datasource:
    url: jdbc:postgresql://timescaledb:5432/aggregator_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 40

redis:
  addresses: redis-sentinel:26379

temporal:
  connection:
    target: temporal:7233 # Targets compose container orchestrator channel

server:
  port: 8443 # Target production deployment port bounds

---
# ===================================================================
# PROFILE: TEST (Isolated Maven engine pipeline context layout)
# ===================================================================
spring:
  config:
    activate:
      on-profile: TEST
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    stream:
      enabled: false # Suspends network stream socket bindings during testing phases
  kafka:
    bootstrap-servers: mock-none:9092

  # Drops Kafka and Flyway auto-configurations during isolated testing phases
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

  # In-Memory H2 fallback profile layout simulating PostgreSQL definitions
  datasource:
    url: jdbc:h2:mem:soaesps_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

# --- Switches Strategy Factory to native heuristic text tokenization checks ---
langchain4j:
  chat-model:
    provider: mock
    model-name: mock-test-engine

eureka:
  client:
    enabled: false

server:
  port: 0