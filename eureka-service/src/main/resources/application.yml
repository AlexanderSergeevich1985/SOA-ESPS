spring:
  application:
    name: eureka-service

  profiles:
    active: TEST

---
# ===================================================================
# CONFIGURATION FOR PROFILE: DEV (Fetches config from Config Server)
# ===================================================================
spring:
  config:
    activate:
      on-profile: DEV
    # Modern Spring Boot 3.x way to import external configuration.
    # Uses optional: prefix so the app doesn't crash instantly if config server is booting up.
    import: "optional:configserver:http://${CONFIG_USER_NAME}:${CONFIG_SERVICE_PASSWORD}@config:8888"

eureka:
  instance:
    prefer-ip-address: true
  client:
    # CamelCase properties fixed to standard kebab-case for Spring Boot 3
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
# ===================================================================
# CONFIGURATION FOR PROFILE: TEST (Config Server disabled, pure YAML)
# ===================================================================
spring:
  config:
    activate:
      on-profile: TEST
  # Completely disables the bootstrap and cloud config client attempts for tests
  cloud:
    config:
      enabled: false

server:
  port: 8761

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Bypasses the initial wait time when registry is empty (replaces your waitTimeInMsWhenSyncEmpty)
    wait-time-in-ms-when-sync-empty: 0
    # Prevents Eureka from holding dead instances during rapid test cycles
    enable-self-preservation: false