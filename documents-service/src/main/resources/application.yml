spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://your-auth-server/oauth2/token
          # Или jwk-set-uri: http://your-auth-server/oauth2/jwks
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:documents}
      # For authenticated connections, use a full URI instead:
      # uri: mongodb://user:password@localhost:27017/documents