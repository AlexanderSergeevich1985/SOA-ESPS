syntax = "proto3";

package com.soaesps.notifications.grpc.service;

option java_multiple_files = true;
option java_package = "com.soaesps.notifications.grpc.service";

// Service handling both atomic user persistence and standalone routing events
service NotificationGrpcService {

  // Use case 1: Register a new contact in DB and trigger a welcome notification atomically
  rpc RegisterAndNotify (RegistrationRequest) returns (NotificationResponse);

  // Use case 2: Send a standalone notification using an existing contact channel
  rpc SendNotification (NotificationRequest) returns (NotificationResponse);
}

// Composite inbound payload for registration actions coupled with template triggering
message RegistrationRequest {
  string user_id = 1;
  repeated ContactDetails contact_details = 2;
  NotificationDetails notification_details = 3;
}

// Standalone inbound payload for routing plain notifications without database writes
message NotificationRequest {
  string user_id = 1;

  // Target routing endpoint (e.g., "user@example.com", "+12345678", "chat_id_123")
  string recipient = 2;

  // Communication channel type: "EMAIL", "TELEGRAM", "SMS", "PUSH"
  ChannelType channel_type = 3;

  // Reusable template processing model
  NotificationDetails notification_details = 4;
}

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  EMAIL = 1;
  TELEGRAM = 2;
  SMS = 3;
  PUSH = 4;
}

// Database configuration model for new contact registration
message ContactDetails {
  string type = 1;
  bool is_primary = 2;
  map<string, string> contact_meta = 3;
}

// Template rendering model for layout contextual parsing
message NotificationDetails {
  string template_name = 1;
  map<string, string> template_payload = 2;
}

// Unified transmission response status model
message NotificationResponse {
  bool is_success = 1;
  string tracking_id = 2;
  string error_message = 3;
}